id = "claude"
match_commands = ["claude"]

[[rules]]
state = "processing"
priority = 100
region = "title"
regex = '^[\x{2800}-\x{28FF}] '

[[rules]]
state = "skip"
priority = 95
region = "whole"
contains = ["showing detailed transcript"]

[[rules]]
state = "skip"
priority = 94
region = "whole"
contains = ["select model", "esc to cancel"]

[[rules]]
state = "waiting"
priority = 80
region = "whole"
contains = ["do you want to proceed?"]

[[rules]]
state = "idle"
priority = 10
# prompt_block:5, not last_lines: Claude can draw a task panel (running
# subagents/background tasks) under the footer, and its rows push the prompt out
# of any bottom-anchored window. The block starts at the last ❯ that sits above
# a box border and spans ❯, border, 🤖 status line, mode hint and one more row.
# A typed prompt of 3+ lines pushes the footer past the block (bg drops to 0
# while typing; idle still matches on the ❯ line itself).
region = "prompt_block:5"
regex = '❯'
not = [ { contains = ["do you want to proceed?"] } ]

# Background shells outlive the turn that started them, so this is a flag, not
# a state: the pane may be idle, processing, or waiting while it holds one.
# Anchored on the footer's `·` separator and confined to the prompt block — the
# transcript is full of "Ran 9 shell commands", and old "1 shell still running"
# lines stay in the scrollback long after that shell exited.
[[flags]]
name = "bg"
region = "prompt_block:5"
regex = '·\s*(\d+)\s+shells?\b'
