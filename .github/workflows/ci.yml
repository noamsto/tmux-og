name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Platform-independent, so it runs once here instead of on both build legs.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      # Read-only: no authToken, so nothing this job builds is pushed.
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
      - run: nix build .#lint --accept-flake-config

  build:
    # Matches the ruleset's required check names.
    name: build (${{ matrix.system }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            eval-workers: 4
          - system: aarch64-darwin
            runner: macos-15
            eval-workers: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      NIX_CONFIG: accept-flake-config = true
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      # Read-only, like lint: no authToken, so cachix-action never writes the
      # token into the runner's config where PR-controlled builds could read it.
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
      # Evaluates the non-check outputs (devShells, modules, overlays, apps)
      # that nix-fast-build below does not touch.
      - run: nix flake check --no-build
      # --skip-cached: outputs already in lazytmux are neither rebuilt nor
      # downloaded. Only packages from main are pushed to the cache (below).
      - run: >-
          nix run --inputs-from . nixpkgs#nix-fast-build --
          --no-nom --skip-cached
          --eval-workers ${{ matrix.eval-workers }}
          --flake .#
          --select 'f: f.checks.${{ matrix.system }} // {
          pkg-default = f.packages.${{ matrix.system }}.default;
          pkg-go-tools = f.packages.${{ matrix.system }}.go-tools;
          pkg-tmux-remux = f.packages.${{ matrix.system }}.tmux-remux; }'
      # Pushes each installable package's closure, from main only. Check
      # results and lint closures stay out of the cache.
      - name: Push installable packages to lazytmux
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        # pipefail: a failed nix build must fail this step, not hide behind
        # cachix push's exit status. continue-on-error keeps the job green.
        shell: bash
        run: >-
          nix build
          .#packages.${{ matrix.system }}.default
          .#packages.${{ matrix.system }}.go-tools
          .#packages.${{ matrix.system }}.tmux-remux
          --no-link --print-out-paths
          | cachix push lazytmux
